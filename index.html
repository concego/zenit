<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="description" content="Zenit, um roguelike 2D experimental acessível.">
 <title>Zenit — Roguelike</title>
 <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
 <main id="game" aria-labelledby="gameTitle">
  <h1 id="gameTitle" class="sr-only">Zenit — Roguelike</h1>
  <div id="screenReaderAnnouncer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <section id="frontEnd" aria-labelledby="frontTitle" aria-describedby="frontDescription frontDetails frontHint" tabindex="0">
   <h2 id="frontTitle">Zenit</h2>
   <p id="frontDescription"></p>
   <ul id="frontOptions" role="menu" aria-label="Menu"></ul>
   <p id="frontDetails"></p>
   <p id="frontHint"></p>
  </section>
  <section id="characterCreation" aria-labelledby="characterTitle" aria-describedby="characterIntro" tabindex="0" hidden>
   <h2 id="characterTitle"></h2>
   <p id="characterIntro"></p>
   <p id="characterHint"></p>
   <div class="character-layout">
    <div class="character-form-column">
     <form id="characterForm">
      <label id="characterNameLabel" for="characterName"></label>
      <input id="characterName" name="characterName" type="text" maxlength="32" autocomplete="nickname" required>
      <label id="genderLabel" for="characterGender"></label>
      <select id="characterGender" name="characterGender"></select>
      <label id="classLabel" for="characterClass"></label>
      <select id="characterClass" name="characterClass"></select>
      <p id="characterClassDescription" class="field-description"></p>
      <label id="presetLabel" for="characterPreset"></label>
      <select id="characterPreset" name="characterPreset"></select>
      <label id="characterDescriptionLabel" for="characterDescription"></label>
      <p id="characterDescription" class="field-description" tabindex="0"></p>
      <div class="character-actions">
       <button id="characterConfirm" type="submit"></button>
       <button id="characterCancel" type="button"></button>
      </div>
     </form>
    </div>
    <div class="character-preview-column">
     <svg id="characterPreview" class="character-preview" viewBox="0 0 200 200" role="img"></svg>
    </div>
   </div>
  </section>
  <svg id="gameCanvas" role="img" tabindex="0" aria-label="Mapa do Zenit" hidden></svg>
  <audio id="menuScrollSound" preload="auto" aria-hidden="true">
   <source src="assets/audio/ui/menu-scroll.wav" type="audio/wav">
  </audio>
  <audio id="menuConfirmSound" preload="auto" aria-hidden="true">
   <source src="assets/audio/ui/menu-confirm.wav" type="audio/wav">
  </audio>
  <audio id="menuCancelSound" preload="auto" aria-hidden="true">
   <source src="assets/audio/ui/menu-cancel.wav" type="audio/wav">
  </audio>
  <audio id="inventoryCoinSound" preload="auto" aria-hidden="true">
   <source src="assets/audio/items/rpg-inventory-coin3.wav" type="audio/wav">
  </audio>
  <audio id="inventoryCoinDropSound" preload="auto" aria-hidden="true">
   <source src="assets/audio/items/rpg-inventory-coin.wav" type="audio/wav">
  </audio>
  <audio id="inventoryLeatherArmorSound" preload="auto" aria-hidden="true">
   <source src="assets/audio/items/rpg-inventory-cloth-heavy.wav" type="audio/wav">
  </audio>
  <audio id="inventoryMetalArmorSound" preload="auto" aria-hidden="true">
   <source src="assets/audio/items/rpg-inventory-chainmail1.wav" type="audio/wav">
  </audio>
  <audio id="inventoryPotionUseSound" preload="auto" aria-hidden="true">
   <source src="assets/audio/items/rpg-inventory-bubble.wav" type="audio/wav">
  </audio>
  <audio id="inventoryPotionPickupSound" preload="auto" aria-hidden="true">
   <source src="assets/audio/items/rpg-inventory-bottle.wav" type="audio/wav">
  </audio>
  <audio id="worldChestSound" preload="auto" aria-hidden="true">
   <source src="assets/audio/world/rpg-world-door.wav" type="audio/wav">
  </audio>
  <audio id="slimeBossStepSound" preload="auto" aria-hidden="true">
   <source src="assets/audio/enemies/rpg-npc-slime-slime9.wav" type="audio/wav">
  </audio>
  <audio id="slimeBossAttackSound" preload="auto" aria-hidden="true">
   <source src="assets/audio/enemies/rpg-npc-slime-slime8.wav" type="audio/wav">
  </audio>
  <audio id="slimeBossHitSound" preload="auto" aria-hidden="true">
   <source src="assets/audio/enemies/rpg-npc-slime-slime10.wav" type="audio/wav">
  </audio>
  <audio id="slimeHitSound" preload="auto" aria-hidden="true">
   <source src="assets/audio/enemies/rpg-misc-random3.wav" type="audio/wav">
  </audio>
  <audio id="mysticSpellSound" preload="auto" aria-hidden="true">
   <source src="https://raw.githubusercontent.com/concego/sound-testing/main/sounds/01-efeitos-acoes/80-cc0-spell_fire_07.ogg" type="audio/ogg">
  </audio>
  <audio id="battleSwingSound" preload="auto" aria-hidden="true">
   <source src="assets/audio/weapons/rpg-battle-swing.wav" type="audio/wav">
  </audio>
  <audio id="battleSwing2Sound" preload="auto" aria-hidden="true">
   <source src="assets/audio/weapons/rpg-battle-swing2.wav" type="audio/wav">
  </audio>
  <audio id="battleSwing3Sound" preload="auto" aria-hidden="true">
   <source src="assets/audio/weapons/rpg-battle-swing3.wav" type="audio/wav">
  </audio>
  <audio id="battleUnsheatheSound" preload="auto" aria-hidden="true">
   <source src="assets/audio/weapons/rpg-battle-sword-unsheathe.wav" type="audio/wav">
  </audio>
  <audio id="battleUnsheathe2Sound" preload="auto" aria-hidden="true">
   <source src="assets/audio/weapons/rpg-battle-sword-unsheathe2.wav" type="audio/wav">
  </audio>
  <audio id="battleUnsheathe3Sound" preload="auto" aria-hidden="true">
   <source src="assets/audio/weapons/rpg-battle-sword-unsheathe3.wav" type="audio/wav">
  </audio>
  <audio id="battleUnsheathe4Sound" preload="auto" aria-hidden="true">
   <source src="assets/audio/weapons/rpg-battle-sword-unsheathe4.wav" type="audio/wav">
  </audio>
  <audio id="battleUnsheathe5Sound" preload="auto" aria-hidden="true">
   <source src="assets/audio/weapons/rpg-battle-sword-unsheathe5.wav" type="audio/wav">
  </audio>
  <audio id="menuMusic" loop preload="auto" aria-hidden="true">
   <source src="sons/musica/Exploração%20Subterrânea%20-%20Versão%201.mp3" type="audio/mpeg">
  </audio>
  <audio id="levelMusic" loop preload="auto" aria-hidden="true">
   <source src="sons/musica/Forgotten-Tomb-Ambience-CC0.mp3" type="audio/mpeg">
  </audio>
 </main>
 <script type="module" src="src/js/game.js?v=audio-mystic1"></script>
</body>
</html>
