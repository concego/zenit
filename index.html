<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="description" content="Zenit, um roguelike 2D experimental acessível.">
 <title>Zenit — Roguelike</title>
 <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
 <main id="game" aria-labelledby="gameTitle">
  <h1 id="gameTitle" class="sr-only">Zenit — Roguelike</h1>
  <div id="screenReaderAnnouncer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <section id="frontEnd" aria-labelledby="frontTitle" aria-describedby="frontDescription frontDetails frontHint" tabindex="0">
   <h2 id="frontTitle">Zenit</h2>
   <p id="frontDescription"></p>
   <ul id="frontOptions" role="menu" aria-label="Menu"></ul>
   <p id="frontDetails"></p>
   <p id="frontHint"></p>
  </section>
  <section id="characterCreation" aria-labelledby="characterTitle" aria-describedby="characterIntro" tabindex="0" hidden>
   <h2 id="characterTitle"></h2>
   <p id="characterIntro"></p>
   <p id="characterHint"></p>
   <div class="character-layout">
    <div class="character-form-column">
     <form id="characterForm">
      <label id="characterNameLabel" for="characterName"></label>
      <input id="characterName" name="characterName" type="text" maxlength="32" autocomplete="nickname" required>
      <label id="genderLabel" for="characterGender"></label>
      <select id="characterGender" name="characterGender"></select>
      <label id="classLabel" for="characterClass"></label>
      <select id="characterClass" name="characterClass"></select>
      <p id="characterClassDescription" class="field-description"></p>
      <label id="presetLabel" for="characterPreset"></label>
      <select id="characterPreset" name="characterPreset"></select>
      <label id="characterDescriptionLabel" for="characterDescription"></label>
      <p id="characterDescription" class="field-description" tabindex="0"></p>
      <div class="character-actions">
       <button id="characterConfirm" type="submit"></button>
       <button id="characterCancel" type="button"></button>
      </div>
     </form>
    </div>
    <div class="character-preview-column">
     <svg id="characterPreview" class="character-preview" viewBox="0 0 200 200" role="img"></svg>
    </div>
   </div>
  </section>
  <button id="audioUnlock" type="button" hidden></button>
  <svg id="gameCanvas" role="img" tabindex="0" aria-label="Mapa do Zenit" hidden></svg>
  <audio id="menuMusic" loop preload="auto" aria-hidden="true">
   <source src="sons/musica/Exploração%20Subterrânea%20-%20Versão%201.mp3" type="audio/mpeg">
  </audio>
  <audio id="levelMusic" loop preload="auto" aria-hidden="true">
   <source src="sons/musica/Forgotten-Tomb-Ambience-CC0.mp3" type="audio/mpeg">
  </audio>
 </main>
 <script type="module" src="src/js/game.js?v=audio4"></script>
</body>
</html>
